<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eee6">
  <title>工作台入口</title>
  <link rel="icon" type="image/png" href="./icon-192.png">
  <!-- Keep this page a plain bookmark target: no manifest, install prompt or
       service-worker registration. Edge's installed
       workbench entry disappears after reboot on the reported Redmi K40.
       Normal launches redirect to the same-origin workbench. The ?setup=1
       route removes its query without navigating, so Edge can create a plain
       shortcut whose saved target is shortcut.html. This optional route is a
       workaround, not a fix for the browser/launcher. Same-origin navigation
       preserves the existing browser's storage and synchronization settings.
       Do not copy index.html or change the production manifest to implement
       this workaround. -->
  <script>
    (function () {
      var setup = new URLSearchParams(location.search).get('setup') === '1';
      if (setup) {
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
        return;
      }
      location.replace('./');
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px;
      background: #f4eee6; color: #40352d;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    main { max-width: 440px; margin: 8vh auto 0; padding: 32px 24px;
      background: #fffaf3; border: 1px solid #d9cbbb; border-radius: 24px; }
    img { display: block; width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 24px 0 12px; font-size: 28px; }
    p { line-height: 1.8; }
    .open { display: block; padding: 16px; margin: 28px 0 20px;
      border-radius: 12px; background: #7c2926; color: white;
      text-align: center; text-decoration: none; font-weight: 650; }
    .open:focus-visible { outline: 3px solid #40352d; outline-offset: 4px; }
    .help { font-size: 14px; color: #66574b; }
    footer { margin-top: 24px; padding-top: 18px; border-top: 1px solid #e6dace; }
  </style>
</head>
<body>
  <main>
    <img src="./icon-192.png" alt="" width="72" height="72">
    <h1>个人工作台</h1>
    <p>把这个入口添加到桌面后，点击图标会直接进入工作台。</p>
    <a class="open" href="./">立即打开工作台</a>
    <footer class="help">
      <p><strong>添加方法：</strong>停留在本页，通过浏览器菜单选择“添加到桌面”或“创建快捷方式”。</p>
      <p>以后点击桌面上的“工作台入口”，会自动打开工作台。</p>
    </footer>
  </main>
</body>
</html>
