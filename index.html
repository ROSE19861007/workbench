<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人工作台 · GitHub 镜像</title>
<style>
  :root{
    --ink:#2b2118; --paper:#f4ece0; --paper2:#efe4d3; --line:#d9c7ad;
    --red:#8e2323; --red2:#781c1c; --gold:#b8893b; --green:#3f7d4f;
    --shadow:0 2px 8px rgba(80,50,20,.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Sarasa Gothic SC","Noto Sans SC",system-ui,-apple-system,"Microsoft YaHei",sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.5;}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#fff8ef,#f4ece0);
    border-bottom:2px solid var(--line); padding:10px 16px; display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  header h1{font-size:18px;margin:0;color:var(--red2);letter-spacing:1px;}
  header h1 .sub{font-size:11px;color:#9a8a72;font-weight:400;margin-left:6px;letter-spacing:0;}
  .spacer{flex:1;}
  .status{font-size:12px;color:#7a6a52;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 12px;}
  .status.ok{color:var(--green);border-color:#bfe0c6;}
  .status.err{color:var(--red);border-color:#e8c0c0;}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:7px 13px;font-size:13px;color:var(--ink);transition:.15s;}
  button:hover{background:var(--paper2);}
  button.primary{background:var(--red);color:#fff;border-color:var(--red2);}
  button.primary:hover{background:var(--red2);}
  .mini{padding:2px 8px;font-size:11px;border-radius:6px;margin-left:4px;}
  .mini.del{color:var(--red);border-color:#e3bdbd;}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 60px;}
  .cat{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;}
  .cat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--paper2);border-bottom:1px solid var(--line);}
  .cat-head .ct{font-size:16px;font-weight:700;color:var(--red2);}
  .cat-head .tag{font-size:11px;color:#9a8a72;border:1px solid var(--line);border-radius:10px;padding:1px 8px;}
  .cat-body{padding:10px 16px 16px;}
  .group{border-left:3px solid var(--line);margin:10px 0 10px 6px;padding-left:12px;}
  .group.collapsed>.group-body{display:none;}
  .group-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .caret{cursor:pointer;color:#9a8a72;user-select:none;width:14px;display:inline-block;text-align:center;}
  .g-title{font-weight:600;color:var(--ink);}
  .g-title[contenteditable="true"]{outline:2px solid var(--gold);border-radius:4px;padding:0 4px;background:#fffdf6;}
  .leaf{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #ece0cf;}
  .leaf:last-child{border-bottom:none;}
  .leaf .cb{width:16px;height:16px;flex:none;cursor:pointer;}
  .leaf .lt{flex:1;}
  .leaf.done .lt{text-decoration:line-through;color:#a89a85;}
  .leaf .due{font-size:11px;color:#9a8a72;}
  .badge{font-size:10px;border-radius:8px;padding:1px 7px;margin-left:4px;}
  .b-imp{background:#fbe3e3;color:var(--red);border:1px solid #eccaca;}
  .b-urg{background:#fff0d6;color:#9a6b1f;border:1px solid #f0d9a8;}
  .b-type{background:#eef0f4;color:#5a6678;border:1px solid #d8dde6;}
  a.link{color:var(--red);text-decoration:none;border-bottom:1px solid #d9b3b3;}
  a.link:hover{color:var(--red2);}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
  .quad .q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:90px;}
  .quad .q h4{margin:0 0 8px;font-size:13px;}
  .q.q1{border-top:3px solid var(--red);} .q.q2{border-top:3px solid var(--gold);}
  .q.q3{border-top:3px solid #6b8fb0;} .q.q4{border-top:3px solid #9aa39a;}
  .note{background:#fffaf0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-style:italic;color:#5a4c38;margin-top:4px;}
  .empty{color:#b3a48c;font-size:12px;padding:4px 0;}
  .overlay{position:fixed;inset:0;background:rgba(40,28,16,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .overlay.show{display:flex;}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);
    width:min(520px,100%);max-height:86vh;overflow:auto;padding:18px 20px;}
  .panel h3{margin:0 0 14px;color:var(--red2);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:#7a6a52;margin-bottom:4px;}
  .field input,.field textarea,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:14px;background:#fff;color:var(--ink);}
  .field textarea{min-height:120px;resize:vertical;}
  .row{display:flex;gap:14px;}
  .row>.field{flex:1;}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;}
  .hint{font-size:12px;color:#9a8a72;background:#fff7ea;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:24px;font-size:13px;opacity:0;transition:.25s;z-index:80;pointer-events:none;}
  .toast.show{opacity:1;}
  @media(max-width:560px){ .quad{grid-template-columns:1fr;} header h1{font-size:16px;} }
</style>
</head>
<body>
<header>
  <h1>个人工作台<span class="sub">GitHub 镜像 · 跨设备同步</span></h1>
  <div class="spacer"></div>
  <span id="syncStatus" class="status">未同步</span>
  <button id="btnSettings">⚙ 同步设置</button>
  <button id="btnAddCat" class="primary">+ 分类</button>
</header>

<main id="main"></main>

<!-- 设置 / 数据管理 -->
<div class="overlay" id="ovSettings">
  <div class="panel">
    <h3>同步设置与数据管理</h3>
    <div class="hint">数据存放在你的私有仓库 <code>workbench-data</code>。每台设备首次打开需填一次访问令牌（token），之后自动同步。更改会自动保存并上传。</div>
    <div class="field">
      <label>GitHub 同步地址（已预填，一般不用改）</label>
      <input id="setUrl" type="text">
    </div>
    <div class="field">
      <label>访问令牌 Token（在 GitHub → Settings → Developer settings → Personal access tokens 生成，需 repo 权限）</label>
      <input id="setToken" type="password" placeholder="ghp_...">
    </div>
    <div class="actions">
      <button id="setPull">↓ 立即拉取</button>
      <button id="setPush">↑ 立即上传</button>
      <button id="setSave" class="primary">保存并同步</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0;">
    <div class="field">
      <label>从粘贴内容导入（把官方工作台「复制状态 JSON」的内容粘到这里）</label>
      <textarea id="pasteBox" placeholder="在此粘贴完整的 JSON 状态…"></textarea>
    </div>
    <div class="actions">
      <button id="importPaste">从粘贴内容导入</button>
      <button id="copyJson">复制当前状态 JSON</button>
      <button id="downloadJson">下载备份</button>
    </div>
  </div>
</div>

<!-- 新增任务 -->
<div class="overlay" id="ovTask">
  <div class="panel">
    <h3 id="taskTitle">新增任务</h3>
    <div class="field"><label>标题</label><input id="tTitle" type="text"></div>
    <div class="row">
      <div class="field"><label>日期</label><input id="tDue" type="date"></div>
      <div class="field"><label>时间</label><input id="tTime" type="time"></div>
    </div>
    <div class="row">
      <div class="field"><label class="chk"><input id="tImp" type="checkbox"> 重要</label></div>
      <div class="field"><label class="chk"><input id="tUrg" type="checkbox"> 紧急</label></div>
    </div>
    <div class="field"><label>链接（可选）</label><input id="tUrl" type="text" placeholder="https://"></div>
    <div class="actions">
      <button id="taskCancel">取消</button>
      <button id="taskSave" class="primary">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const DEFAULT_URL = "https://api.github.com/repos/rose19861007/workbench-data/contents/workbench-state.json";
const STORAGE_KEY = "workbench-mirror-v2";
let state = defaultState();
let collapsed = new Set();
let pushTimer = null;
let lastSha = null;

function defaultState(){
  return { version:2, sync:{url:DEFAULT_URL, token:"", lastSync:null},
    categories:{}, quadrantTasks:[], inspirationNotes:[], meta:{} };
}
function normalize(s){
  s = s || {};
  if(!s.version) s.version = 2;
  if(!s.sync) s.sync = {url:DEFAULT_URL, token:"", lastSync:null};
  if(!s.sync.url) s.sync.url = DEFAULT_URL;
  if(typeof s.categories === "undefined" || s.categories === null) s.categories = {};
  if(Array.isArray(s.categories)) s.categories = {"导入数据":{enabled:true, items:s.categories}};
  if(!Array.isArray(s.quadrantTasks)) s.quadrantTasks = [];
  if(!Array.isArray(s.inspirationNotes)) s.inspirationNotes = [];
  if(!s.meta) s.meta = {};
  return s;
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function genId(){ return uid(); }

// ---------- 状态存取 ----------
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = normalize(JSON.parse(raw)); return true; }
  }catch(e){}
  return false;
}
function setStatus(text, cls){
  const el = document.getElementById("syncStatus");
  el.textContent = text; el.className = "status" + (cls?(" "+cls):"");
}

// ---------- 树查找 / 修改 ----------
function walk(arr, fn){
  if(!Array.isArray(arr)) return;
  for(const it of arr){ fn(it); if(it.items) walk(it.items, fn); }
}
function findNode(id){
  for(const cat of Object.keys(state.categories)){
    let found = null;
    walk(state.categories[cat].items, it=>{ if(it.id===id) found = it; });
    if(found) return found;
  }
  for(const t of state.quadrantTasks) if(t.id===id) return t;
  for(const n of state.inspirationNotes) if(n.id===id) return n;
  return null;
}
function removeFromArr(arr, id){
  for(let i=0;i<arr.length;i++){
    if(arr[i].id===id){ arr.splice(i,1); return true; }
    if(arr[i].items && removeFromArr(arr[i].items, id)) return true;
  }
  return false;
}
function removeNode(id){
  for(const cat of Object.keys(state.categories)){
    if(removeFromArr(state.categories[cat].items, id)) return true;
  }
  let i = state.quadrantTasks.findIndex(t=>t.id===id);
  if(i>=0){ state.quadrantTasks.splice(i,1); return true; }
  i = state.inspirationNotes.findIndex(n=>n.id===id);
  if(i>=0){ state.inspirationNotes.splice(i,1); return true; }
  return false;
}
function findGroup(id){
  const n = findNode(id);
  return (n && n.type==="group") ? n : null;
}

// ---------- 渲染 ----------
function renderAll(){
  const main = document.getElementById("main");
  const cats = Object.keys(state.categories);
  let html = "";
  if(cats.length===0) html += '<div class="empty">还没有分类。点右上角「+ 分类」开始。</div>';
  for(const cat of cats){
    const c = state.categories[cat];
    html += `<div class="cat" data-cat="${esc(cat)}">
      <div class="cat-head">
        <span class="ct">${esc(cat)}</span>
        <span class="tag">${c.items?c.items.length:0} 项</span>
        <div class="spacer"></div>
        <button class="mini" data-action="add-task" data-id="cat:${esc(cat)}">+任务</button>
        <button class="mini" data-action="add-group" data-id="cat:${esc(cat)}">+组</button>
        <button class="mini del" data-action="del-cat" data-id="${esc(cat)}">×</button>
      </div>
      <div class="cat-body">${c.items&&c.items.length?renderItems(c.items):'<div class="empty">（空）</div>'}</div>
    </div>`;
  }
  // 四象限
  html += renderQuadrant();
  // 灵感笔记
  if(state.inspirationNotes.length){
    html += '<div class="cat"><div class="cat-head"><span class="ct">灵感笔记</span><span class="tag">'+state.inspirationNotes.length+'</span></div><div class="cat-body">';
    for(const n of state.inspirationNotes){
      html += `<div class="note">${esc(n.text)} <button class="mini del" data-action="del" data-id="${esc(n.id)}">×</button></div>`;
    }
    html += '</div></div>';
  }
  main.innerHTML = html;
}
function renderItems(items){
  return items.map(it=>{
    if(it.type==="group"){
      const isCol = collapsed.has(it.id);
      return `<div class="group ${isCol?'collapsed':''}" data-id="${esc(it.id)}">
        <div class="group-head">
          <span class="caret" data-action="toggle-group" data-id="${esc(it.id)}">${isCol?'▸':'▾'}</span>
          <span class="g-title" data-action="edit-title" data-id="${esc(it.id)}">${esc(it.title)}</span>
          <span class="tag" style="font-size:11px;color:#9a8a72;border:1px solid var(--line);border-radius:10px;padding:1px 8px;">${it.items?it.items.length:0}</span>
          <button class="mini" data-action="add-task" data-id="${esc(it.id)}">+任务</button>
          <button class="mini" data-action="add-group" data-id="${esc(it.id)}">+组</button>
          <button class="mini del" data-action="del" data-id="${esc(it.id)}">×</button>
        </div>
        <div class="group-body">${it.items&&it.items.length?renderItems(it.items):'<div class="empty">（空）</div>'}</div>
      </div>`;
    }
    // 叶子
    const done = it.done ? "done" : "";
    const checked = it.done ? "checked" : "";
    let extra = "";
    if(it.important) extra += '<span class="badge b-imp">重要</span>';
    if(it.urgent) extra += '<span class="badge b-urg">紧急</span>';
    if(it.type && it.type!=="task") extra += `<span class="b-type badge">${esc({url:'链接',skill:'技能',expert:'专家'}[it.type]||it.type)}</span>`;
    let due = "";
    if(it.due) due += it.due + (it.dueTime?(" "+it.dueTime):"");
    let link = "";
    if(it.type==="url" && it.url) link = ` <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener">打开↗</a>`;
    else if(it.url) link = ` <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener">打开↗</a>`;
    const titleEditable = it.type==="task" ? "" : ' data-action="edit-title"';
    return `<div class="leaf ${done}" data-id="${esc(it.id)}">
      ${it.type==="task"?`<input class="cb" type="checkbox" data-action="toggle-done" data-id="${esc(it.id)}" ${checked}>` : '<span style="width:16px;display:inline-block"></span>'}
      <span class="lt"${titleEditable} data-id="${esc(it.id)}">${esc(it.title)}${link}</span>
      ${due?`<span class="due">📅 ${esc(due)}</span>`:""}
      ${extra}
      <button class="mini del" data-action="del" data-id="${esc(it.id)}">×</button>
    </div>`;
  }).join("");
}
function renderQuadrant(){
  const Q=[,[],[]]; // index by 1..4
  Q[1]=[];Q[2]=[];Q[3]=[];Q[4]=[];
  for(const t of state.quadrantTasks){
    const imp=!!t.important, urg=!!t.urgent;
    const idx = imp?(urg?1:2):(urg?3:4);
    Q[idx].push(t);
  }
  const cell=(cls,title,arr)=>{
    let h = `<div class="q ${cls}"><h4>${title}（${arr.length}）</h4>`;
    if(arr.length===0) h += '<div class="empty">—</div>';
    for(const t of arr){
      h += `<div class="leaf ${t.done?'done':''}" data-id="${esc(t.id)}">
        <input class="cb" type="checkbox" data-action="toggle-done" data-id="${esc(t.id)}" ${t.done?'checked':''}>
        <span class="lt" data-action="edit-title" data-id="${esc(t.id)}">${esc(t.title)}</span>
        ${t.due?`<span class="due">📅 ${esc(t.due)}</span>`:''}
        ${t.url?`<a class="link" href="${esc(t.url)}" target="_blank" rel="noopener">↗</a>`:''}
        <button class="mini del" data-action="del" data-id="${esc(t.id)}">×</button>
      </div>`;
    }
    return h + '</div>';
  };
  return `<div class="cat"><div class="cat-head"><span class="ct">四象限任务</span><span class="tag">${state.quadrantTasks.length}</span>
    <div class="spacer"></div><button class="mini" data-action="add-quad">+任务</button></div>
    <div class="cat-body"><div class="quad">
      ${cell('q1','重要 · 紧急',Q[1])}
      ${cell('q2','重要 · 不紧急',Q[2])}
      ${cell('q3','不重要 · 紧急',Q[3])}
      ${cell('q4','不重要 · 不紧急',Q[4])}
    </div></div></div>`;
}

// ---------- 事件 ----------
document.getElementById("main").addEventListener("click", e=>{
  const act = e.target.getAttribute("data-action");
  if(!act) return;
  const id = e.target.getAttribute("data-id");
  if(act==="toggle-group"){ if(collapsed.has(id)) collapsed.delete(id); else collapsed.add(id); renderAll(); return; }
  if(act==="toggle-done"){ const n=findNode(id); if(n){ n.done=!n.done; commit(); } return; }
  if(act==="del"){ if(confirm("确定删除该项？")){ removeNode(id); commit(); } return; }
  if(act==="del-cat"){ if(confirm("删除整个分类「"+id+"」？")){ delete state.categories[id]; commit(); } return; }
  if(act==="add-task"){ openTask(id); return; }
  if(act==="add-group"){ const name=prompt("输入组名称："); if(name){ const g={id:genId(),type:"group",title:name,enabled:true,items:[]}; addInto(id,g); commit(); } return; }
  if(act==="add-quad"){ openTask("quad"); return; }
  if(act==="edit-title"){
    const span = e.target;
    if(span.getAttribute("contenteditable")==="true") return;
    span.setAttribute("contenteditable","true"); span.focus();
    const finish=()=>{ span.removeAttribute("contenteditable"); const n=findNode(id); if(n){ n.title=span.textContent.trim()||n.title; commit(); } };
    span.addEventListener("blur", finish, {once:true});
    span.addEventListener("keydown", ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); span.blur(); } });
    return;
  }
});
function addInto(targetId, node){
  if(targetId==="quad"){ state.quadrantTasks.push(node); return; }
  if(targetId.startsWith("cat:")){ const cat=targetId.slice(4); if(!state.categories[cat]) state.categories[cat]={enabled:true,items:[]}; state.categories[cat].items.push(node); return; }
  const g = findGroup(targetId);
  if(g){ if(!g.items) g.items=[]; g.items.push(node); }
  else { // 兜底加到第一个分类
    const cat=Object.keys(state.categories)[0]; if(cat) state.categories[cat].items.push(node);
  }
}

// 新增任务弹窗
let taskTarget = "quad";
function openTask(target){
  taskTarget = target;
  document.getElementById("taskTitle").textContent = target==="quad" ? "新增四象限任务" : "新增任务";
  document.getElementById("tTitle").value="";
  document.getElementById("tDue").value="";
  document.getElementById("tTime").value="";
  document.getElementById("tImp").checked=false;
  document.getElementById("tUrg").checked=false;
  document.getElementById("tUrl").value="";
  document.getElementById("ovTask").classList.add("show");
  document.getElementById("tTitle").focus();
}
document.getElementById("taskCancel").onclick=()=>document.getElementById("ovTask").classList.remove("show");
document.getElementById("taskSave").onclick=()=>{
  const title=document.getElementById("tTitle").value.trim();
  if(!title){ alert("请填写标题"); return; }
  const node={ id:genId(), type:"task", title, enabled:true,
    due:document.getElementById("tDue").value, dueTime:document.getElementById("tTime").value,
    important:document.getElementById("tImp").checked, urgent:document.getElementById("tUrg").checked,
    done:false, inQuadrant:true, note:"",
    url:document.getElementById("tUrl").value.trim() };
  addInto(taskTarget, node);
  document.getElementById("ovTask").classList.remove("show");
  commit();
};
document.getElementById("btnAddCat").onclick=()=>{
  const name=prompt("输入新分类名称：");
  if(name && !state.categories[name]){ state.categories[name]={enabled:true,items:[]}; commit(); }
};

// ---------- 提交（本地保存 + 自动上传） ----------
function commit(){
  saveState(); renderAll(); schedulePush();
}
function schedulePush(){
  setStatus("待同步…");
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{ doPush().catch(()=>{}); }, 1500);
}

// ---------- GitHub 同步 ----------
function token(){ return state.sync.token; }
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64){ return decodeURIComponent(escape(atob(b64))); }
async function ghGet(){
  const r = await fetch(state.sync.url, {headers:{Authorization:"Bearer "+token(), Accept:"application/vnd.github+json"}});
  if(r.status===404) return {exists:false};
  if(!r.ok) throw new Error("GET "+r.status);
  const j = await r.json();
  return {exists:true, content:JSON.parse(b64decode(j.content)), sha:j.sha};
}
async function ghPut(contentObj, sha){
  const body={ message:"sync: "+new Date().toISOString(), content:b64encode(JSON.stringify(contentObj,null,0)) };
  if(sha) body.sha=sha;
  const r = await fetch(state.sync.url, {method:"PUT",
    headers:{Authorization:"Bearer "+token(), "Content-Type":"application/json", Accept:"application/vnd.github+json"},
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error("PUT "+r.status);
  const j = await r.json();
  lastSha = j.content.sha;
  return true;
}
async function doPull(){
  if(!token()){ setStatus("未配置令牌", "err"); return; }
  setStatus("拉取中…");
  try{
    const res = await ghGet();
    if(!res.exists){ setStatus("仓库为空", "err"); return; }
    const incoming = normalize(res.content);
    lastSha = res.sha;
    // 防覆盖护栏：云端无有效数据时不覆盖本地
    const remoteHas = incoming.categories && Object.keys(incoming.categories).length>0;
    if(!remoteHas && state && Object.keys(state.categories).length>0){ setStatus("云端为空，保留本地", "ok"); return; }
    const hadLocal = Object.keys(state.categories).length>0;
    state = incoming;
    state.sync.token = token(); // 保留本机令牌
    if(!state.sync.url) state.sync.url = DEFAULT_URL;
    saveState(); renderAll();
    setStatus(hadLocal?("已拉取并合并"):("已同步 ✓"), "ok");
  }catch(err){ setStatus("拉取失败："+err.message, "err"); }
}
async function doPush(){
  if(!token()){ setStatus("未配置令牌", "err"); return; }
  try{
    // 取最新 sha
    let sha = lastSha;
    try{ const r = await ghGet(); if(r.exists) sha = r.sha; }catch(e){}
    const payload = { version:state.version, sync:{url:state.sync.url, token:state.sync.token, lastSync:new Date().toISOString()},
      categories:state.categories, quadrantTasks:state.quadrantTasks, inspirationNotes:state.inspirationNotes, meta:state.meta };
    await ghPut(payload, sha);
    state.sync.lastSync = new Date().toISOString();
    setStatus("已同步 ✓", "ok");
  }catch(err){ setStatus("上传失败："+err.message, "err"); }
}

// ---------- 设置弹窗 ----------
const ovS = document.getElementById("ovSettings");
document.getElementById("btnSettings").onclick=()=>{
  document.getElementById("setUrl").value = state.sync.url||DEFAULT_URL;
  document.getElementById("setToken").value = state.sync.token||"";
  ovS.classList.add("show");
};
ovS.addEventListener("click", e=>{ if(e.target===ovS) ovS.classList.remove("show"); });
document.getElementById("setSave").onclick=()=>{
  state.sync.url = document.getElementById("setUrl").value.trim()||DEFAULT_URL;
  state.sync.token = document.getElementById("setToken").value.trim();
  saveState(); ovS.classList.remove("show");
  doPull();
};
document.getElementById("setPull").onclick=()=>doPull();
document.getElementById("setPush").onclick=()=>doPush();
document.getElementById("importPaste").onclick=()=>{
  const txt = document.getElementById("pasteBox").value.trim();
  if(!txt){ alert("请先粘贴 JSON"); return; }
  try{
    const s = normalize(JSON.parse(txt));
    if(!s.categories || Object.keys(s.categories).length===0 && s.quadrantTasks.length===0){ alert("内容里没有任务数据，请确认复制完整"); return; }
    state = s; state.sync.token = document.getElementById("setToken").value.trim()||token();
    if(!state.sync.url) state.sync.url = DEFAULT_URL;
    saveState(); renderAll();
    ovS.classList.remove("show");
    schedulePush();
    toast("导入成功，正在上传…");
  }catch(e){ alert("JSON 解析失败："+e.message); }
};
document.getElementById("copyJson").onclick=()=>{
  const txt = JSON.stringify(state);
  navigator.clipboard.writeText(txt).then(()=>toast("已复制当前状态 JSON"), ()=>{ prompt("复制下面内容：", txt); });
};
document.getElementById("downloadJson").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="workbench-state.json"; a.click();
  toast("已下载备份");
};

// ---------- 工具 ----------
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  if(toastTimer) clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

// ---------- 启动 ----------
function init(){
  loadLocal();
  renderAll();
  if(token()){ doPull(); }
  else { setStatus("未配置令牌", "err"); }
  // 定时轮询 + 切回前台拉取
  setInterval(()=>{ if(token() && document.visibilityState==="visible") doPull(); }, 30000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && token()) doPull(); });
}
init();
</script>
